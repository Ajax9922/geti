name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    name: Scan for secrets & leaked credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  html-security-check:
    name: Check HTML for security issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for inline onclick handlers
        run: |
          if grep -r 'onclick=' --include="*.html" .; then
            echo "❌ Inline onclick handlers found — move to addEventListener"
            exit 1
          else
            echo "✅ No inline onclick handlers"
          fi

      - name: Check for exposed API keys or webhook URLs
        run: |
          if grep -r 'hook\.us2\.make\.com' --include="*.html" . | grep -v '_ep\|_gs\|split\|join'; then
            echo "❌ Possible exposed Make.com webhook URL"
            exit 1
          else
            echo "✅ Webhook URL not plainly exposed"
          fi

      - name: Check CSP is present
        run: |
          if grep -q 'Content-Security-Policy' index.html; then
            echo "✅ CSP found"
          else
            echo "❌ CSP missing from index.html"
            exit 1
          fi
