name: Spectral OpenAPI Validation
permissions:
  contents: read
on:
  push:
    branches:
      - main
      - release**
    paths:
      - 'docs/rest_api/**'
      - '.github/workflows/spectral-openapi-validation.yml'
  pull_request:
    branches:
      - main
      - release**
    paths:
      - 'docs/rest_api/**'
      - '.github/workflows/spectral-openapi-validation.yml'

jobs:
  validate:
    name: Validate OpenAPI with Spectral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Spectral and Swagger CLI
        run: npm install -g @stoplight/spectral-cli @apidevtools/swagger-cli

      - name: Generate OpenAPI Spec
        run: |
          swagger-cli bundle docs/rest_api/openapi.yaml -o bundled-openapi.yaml
        continue-on-error: false

      - name: Validate Generated OpenAPI Spec with Spectral
        run: |
          spectral lint bundled-openapi.yaml --ruleset .spectral.json --verbose
        continue-on-error: false