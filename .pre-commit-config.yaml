default_language_version:
    python: python3.10

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.2
  hooks:
  - id: ruff
    name: Ruff linter on all Python files
    args: ["--fix"]
  - id: ruff-format
    name: Ruff formatter on all Python files

- repo: local
  hooks:
  - id: uv-lock-check
    name: uv lock check
    entry: dev_tools/pre_commit_scripts/check_uv_lock.sh
    language: script
    always_run: true
    pass_filenames: false

- repo: local
  hooks:
  - id: mypy
    name: mypy
    entry: python
    types: ["python"]
    args: ["dev_tools/pre_commit_scripts/find_py_projects_and_run_make_target.py", "mypy"]
    language: python

- repo: local
  hooks:
  - id: spectral-lint
    name: Spectral OpenAPI linting
    language: node
    additional_dependencies: ["@stoplight/spectral-cli@6.11.0"]
    entry: spectral lint
    args: ["--ruleset", ".spectral.json", "--verbose"]
    files: "docs\/rest_api\/.*(json|yaml|yml)"
    types: [file]
